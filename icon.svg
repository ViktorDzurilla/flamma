<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tmavé pozadie so zaoblenými rohmi -->
  <rect width="512" height="512" rx="115" fill="#080808"/>

  <defs>
    <linearGradient id="flameGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="55%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#CC2200"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hlavný plameň -->
  <path filter="url(#glow)"
    d="M256 88
       C 256 88, 298 155, 318 205
       C 342 265, 328 318, 305 350
       C 336 308, 344 255, 322 208
       C 348 252, 362 310, 340 360
       C 324 398, 292 422, 256 432
       C 220 422, 188 398, 172 360
       C 150 310, 164 252, 190 208
       C 168 255, 176 308, 207 350
       C 184 318, 170 265, 194 205
       C 214 155, 256 88, 256 88 Z"
    fill="url(#flameGrad)"/>

  <!-- Svetlé jadro plameňa -->
  <path
    d="M256 210
       C 256 210, 282 248, 288 284
       C 294 322, 278 352, 256 364
       C 234 352, 218 322, 224 284
       C 230 248, 256 210, 256 210 Z"
    fill="url(#coreGrad)"
    opacity="0.8"/>

  <!-- Text FLAMMA -->
  <text x="256" y="490"
    font-family="'Arial Black', Arial, sans-serif"
    font-size="54" font-weight="900"
    fill="#FF5500" fill-opacity="0.85"
    text-anchor="middle"
    letter-spacing="6">FLAMMA</text>
</svg>
